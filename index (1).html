<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Veo 3.1 — Video generator</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --accent: #6c5ce7;
    --accent2: #00d2d3;
    --text: #eaeaea;
    --muted: #9aa0ab;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #0f1115, #1a1d27);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 32px;
    max-width: 560px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.06);
  }
  h1 {
    font-size: 22px;
    margin: 0 0 6px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p.sub { color: var(--muted); margin: 0 0 22px; font-size: 14px; }
  textarea {
    width: 100%;
    min-height: 100px;
    background: #0f1115;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    color: var(--text);
    padding: 14px;
    font-size: 14px;
    resize: vertical;
    outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  .row { display: flex; gap: 10px; margin-top: 14px; align-items: center; }
  input[type="file"] { color: var(--muted); font-size: 13px; }
  button {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border: none;
    color: white;
    padding: 12px 22px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 16px;
    width: 100%;
    transition: transform 0.1s ease, opacity 0.2s;
  }
  button:hover { opacity: 0.92; }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .status {
    margin-top: 18px;
    font-size: 13px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 18px;
  }
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.2);
    border-top-color: var(--accent2);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: none;
  }
  .spinner.active { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  video {
    width: 100%;
    border-radius: 14px;
    margin-top: 20px;
    display: none;
    background: #000;
  }
  .error {
    margin-top: 14px;
    background: rgba(255,80,80,0.1);
    border: 1px solid rgba(255,80,80,0.3);
    color: #ff8080;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    display: none;
  }
  a.download {
    display: none;
    text-align: center;
    margin-top: 12px;
    color: var(--accent2);
    text-decoration: none;
    font-size: 14px;
  }
</style>
</head>
<body>

<div class="card">
  <h1>🎬 Veo 3.1 Video Generator</h1>
  <p class="sub">Matn (yoki rasm) asosida sun'iy intellekt bilan video yarating.</p>

  <textarea id="prompt" placeholder="Masalan: Yomg'ir ostida shahar ko'chasida sekin yurayotgan odam, kino uslubida, kamera orqadan kuzatadi..."></textarea>

  <div class="row">
    <input type="file" id="image" accept="image/*" />
  </div>

  <button id="generateBtn">Video yaratish</button>

  <div class="status" id="status">
    <span class="spinner" id="spinner"></span>
    <span id="statusText"></span>
  </div>

  <div class="error" id="error"></div>

  <video id="result" controls></video>
  <a class="download" id="downloadLink" download="veo-video.mp4">⬇ Videoni yuklab olish</a>
</div>

<script>
const generateBtn = document.getElementById("generateBtn");
const promptEl = document.getElementById("prompt");
const imageEl = document.getElementById("image");
const statusText = document.getElementById("statusText");
const spinner = document.getElementById("spinner");
const errorEl = document.getElementById("error");
const resultEl = document.getElementById("result");
const downloadLink = document.getElementById("downloadLink");

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function setStatus(text, loading) {
  statusText.textContent = text;
  spinner.classList.toggle("active", !!loading);
}

function showError(msg) {
  errorEl.style.display = "block";
  errorEl.textContent = msg;
}

async function pollStatus(operationName) {
  while (true) {
    await new Promise((r) => setTimeout(r, 6000));
    const res = await fetch(`/api/status/${encodeURIComponent(operationName)}`);
    const data = await res.json();

    if (data.error) throw new Error(JSON.stringify(data.error));
    if (data.done) return data.videoUri;

    setStatus("Video tayyorlanmoqda... (bu bir necha daqiqa vaqt olishi mumkin)", true);
  }
}

generateBtn.addEventListener("click", async () => {
  errorEl.style.display = "none";
  resultEl.style.display = "none";
  downloadLink.style.display = "none";

  const prompt = promptEl.value.trim();
  if (!prompt) {
    showError("Iltimos, prompt (tavsif) kiriting.");
    return;
  }

  generateBtn.disabled = true;
  setStatus("So'rov yuborilmoqda...", true);

  try {
    const body = { prompt };

    if (imageEl.files[0]) {
      body.imageBase64 = await fileToBase64(imageEl.files[0]);
      body.imageMimeType = imageEl.files[0].type;
    }

    const startRes = await fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const startData = await startRes.json();

    if (startData.error) throw new Error(JSON.stringify(startData.error));

    setStatus("Video generatsiya boshlandi, kuting...", true);

    const videoUri = await pollStatus(startData.operationName);

    setStatus("Video yuklanmoqda...", true);

    const videoUrl = `/api/video?uri=${encodeURIComponent(videoUri)}`;
    resultEl.src = videoUrl;
    resultEl.style.display = "block";
    downloadLink.href = videoUrl;
    downloadLink.style.display = "block";

    setStatus("Tayyor! ✅", false);
  } catch (err) {
    console.error(err);
    showError("Xatolik yuz berdi: " + err.message);
    setStatus("", false);
  } finally {
    generateBtn.disabled = false;
  }
});
</script>

</body>
</html>
